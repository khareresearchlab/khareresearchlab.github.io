name: Update news and deploy website
on:
  schedule:
    - cron: '17 2 * * *' # Approximately 07:47 India time, daily
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh news
        run: python scripts/update_news.py
      - name: Remove political headlines
        run: |
          python - <<'PYSCREEN'
          import json, re
          from pathlib import Path

          political = re.compile(r"\b(?:politic\w*|government\w*|minister\w*|chief\s+minister|prime\s+minister|cm|pm|mp|mla|president|governor|mayor|senator|congress\w*|parliament\w*|legislat\w*|election\w*|electoral|ballot|vote\w*|party|parties|opposition|coalition|bjp|aap|inc|nda|upa|democrat\w*|republican\w*|labour|tory|tories|modi|kejriwal|gupta|mann|slams?|blames?|critic\w*|accus\w*|lashes|hits\s+out|row|spat|protest\w*|activist\w*|scandal|corrupt\w*|resign\w*)\b", re.I)

          for topic in ("open-burning", "vcp"):
              path = Path(f"assets/{topic}-news.json")
              try:
                  data = json.loads(path.read_text())
              except Exception:
                  data = {"updated_at": None, "items": []}
              items = data.get("items", []) if isinstance(data, dict) else []
              kept = []
              for item in items:
                  text = " ".join(str(item.get(k, "")) for k in ("title", "source", "summary", "description"))
                  if not political.search(text):
                      kept.append(item)
              data["items"] = kept
              data["method"] = "Topic RSS filtering with political-headline exclusion"
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
              print(f"{topic}: retained {len(kept)} of {len(items)}")
          PYSCREEN
      - uses: actions/configure-pages@v5
      - name: Stage existing static website
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='scripts' --exclude='tests' --exclude='__pycache__' --exclude='SETUP.md' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
